networks:
  insightpulse-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  hf-cache:

# Host ports are bound to 127.0.0.1 so infrastructure (no auth in dev) is not
# reachable from other machines on the network.
services:
  # ─── Zookeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: insightpulse-zookeeper
    networks:
      - insightpulse-net
    ports:
      - "127.0.0.1:2181:2181"
    # Persist ZK state so its cluster ID stays consistent with kafka-data across restarts.
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: insightpulse-kafka
    networks:
      - insightpulse-net
    ports:
      # Only the host listener is published; containers use kafka:9092.
      - "127.0.0.1:29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Short session so a stale broker registration from an unclean shutdown expires
      # quickly; together with `restart` this recovers from NodeExistsException.
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ─── Kafka topic init (one-shot) ─────────────────────────────────────────────
  # The Confluent image ignores KAFKA_CREATE_TOPICS, so topics are created here.
  # Idempotent: existing topics are kept; market-events is grown to 3 partitions.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: insightpulse-kafka-init
    networks:
      - insightpulse-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        B=kafka:9092
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic market-events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic market-events-dlq --partitions 1 --replication-factor 1
        P=$$(kafka-topics --bootstrap-server $$B --describe --topic market-events | grep -c 'Partition: ')
        if [ "$$P" -lt 3 ]; then
          kafka-topics --bootstrap-server $$B --alter --topic market-events --partitions 3
        fi
        kafka-topics --bootstrap-server $$B --describe --topic market-events | head -1
    restart: "no"

  # ─── Kafka UI ────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: insightpulse-kafka-ui
    networks:
      - insightpulse-net
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: insightpulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: insightpulse-postgres
    networks:
      - insightpulse-net
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightpulse}
      POSTGRES_USER: ${POSTGRES_USER:-insightpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightpulse_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Ingestion Service (Java/Spring Boot) ────────────────────────────────────
  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: insightpulse-ingestion
    networks:
      - insightpulse-net
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Events that arrive before the model is loaded would fail and go to the DLQ.
      inference-service:
        condition: service_healthy
    environment:
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_MARKET_EVENTS: market-events
      KAFKA_TOPIC_DLQ: market-events-dlq
      # gRPC (calls inference-service)
      GRPC_INFERENCE_HOST: inference-service
      GRPC_INFERENCE_PORT: 50051
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-insightpulse}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-insightpulse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-insightpulse_dev}
      # Spring
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure

  # ─── Inference Service (Python/FastAPI + gRPC) ───────────────────────────────
  inference-service:
    build:
      context: ./inference-service
      dockerfile: Dockerfile
    container_name: insightpulse-inference
    networks:
      - insightpulse-net
    ports:
      - "127.0.0.1:8000:8000"   # HTTP / REST
      - "127.0.0.1:50051:50051" # gRPC
    volumes:
      # Keeps the downloaded HuggingFace model between restarts (~250 MB).
      - hf-cache:/hf-cache
    environment:
      HTTP_PORT: 8000
      GRPC_PORT: 50051
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First start downloads the model.
      start_period: 120s
    restart: on-failure

  # ─── Dashboard Frontend (Next.js) ────────────────────────────────────────────
  dashboard-frontend:
    build:
      context: ./dashboard-frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined into the browser bundle at build time,
      # so they must be build args, not runtime environment variables.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_ENDPOINT: ${NEXT_PUBLIC_WS_ENDPOINT:-ws://localhost:8080/ws/stream}
    container_name: insightpulse-dashboard
    networks:
      - insightpulse-net
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: on-failure
