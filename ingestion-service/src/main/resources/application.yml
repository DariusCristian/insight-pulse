server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/insightpulse
    username: ${DB_USERNAME:insightpulse}
    password: ${DB_PASSWORD:insightpulse_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ingestion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

grpc:
  client:
    inference-service:
      address: static://${GRPC_INFERENCE_HOST:localhost}:${GRPC_INFERENCE_PORT:50051}
      negotiation-type: plaintext

app:
  anomaly:
    threshold: 2.5      # flag when |z| >= threshold
    window-size: 100    # rolling scores kept per asset symbol
    min-samples: 10     # no flagging until a symbol's window holds this many scores
  kafka:
    topics:
      market-events: market-events
